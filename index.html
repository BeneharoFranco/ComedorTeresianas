<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244673">
  <meta name="description" content="Consulta el menú diario y semanal del comedor de Teresianas.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Menú Teresianas</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">

</head>

<body>
  <div id="seasonalSnow" class="seasonal-snow" aria-hidden="true"></div>

  <main class="container">
    <h1 id="currentDay"></h1>
    <div id="subjectMessage"></div>
    <br>
    <div class="day-controls">
      <button id="prevDay" aria-label="Día anterior"><img class="day-arrow" src="arrow-double.svg" alt="" aria-hidden="true"></button>
      <button id="presentDay" aria-label="Volver al menú de hoy">Hoy<br>🍽️</button>
      <button id="nextDay" aria-label="Día siguiente"><img class="day-arrow day-arrow-next" src="arrow-double.svg" alt="" aria-hidden="true"></button>
    </div>
    <!-- <br>
    <div>
    </div> -->
    <br>
    <div class="view-toggle">
      <span id="labelDay" class="view-toggle-label active">Vista diaria</span>
      <label class="switch">
        <input type="checkbox" id="viewToggle" role="switch" aria-label="Vista semanal">
        <span class="slider"></span>
      </label>
      <span id="labelWeek" class="view-toggle-label">Vista semanal</span>
    </div>
    <div id="weekView" aria-live="polite"></div>

    <div><a href="https://laspalmas.escuelateresiana.com/wp-content/uploads/2025/09/MENU-2025-2026.COLEGIO-SANTA-TERESA-DE-JESUS.pdf" target="_blank" rel="noopener noreferrer"> Descargar aquí el menú en
        PDF 📚</a></div> -->
